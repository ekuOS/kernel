# ekuOS x86_64 hardening profile. Use with Clang/LLVM.
# Build setting, not a Kconfig symbol; applied to every make invocation.
LLVM=1

CONFIG_LOCALVERSION="-eku"
CONFIG_LOCALVERSION_AUTO=n
# Expose the architecture's configurable ASLR entropy settings.
CONFIG_EXPERT=y

# Enforced forward-edge kCFI and x86 indirect branch tracking.
# Modern kCFI does not require LTO.
CONFIG_CFI=y
CONFIG_CFI_PERMISSIVE=n
CONFIG_X86_KERNEL_IBT=y
CONFIG_CFI_AUTO_DEFAULT=n

# CPU vulnerability mitigations and address/stack randomization.
CONFIG_CPU_MITIGATIONS=y
CONFIG_MITIGATION_PAGE_TABLE_ISOLATION=y
CONFIG_MITIGATION_RETPOLINE=y
CONFIG_MITIGATION_RETHUNK=y
CONFIG_MITIGATION_UNRET_ENTRY=y
CONFIG_MITIGATION_CALL_DEPTH_TRACKING=y
CONFIG_MITIGATION_IBPB_ENTRY=y
CONFIG_MITIGATION_IBRS_ENTRY=y
CONFIG_MITIGATION_SRSO=y
CONFIG_MITIGATION_GDS=y
CONFIG_MITIGATION_RFDS=y
CONFIG_MITIGATION_SPECTRE_BHI=y
CONFIG_MITIGATION_MDS=y
CONFIG_MITIGATION_TAA=y
CONFIG_MITIGATION_MMIO_STALE_DATA=y
CONFIG_MITIGATION_L1TF=y
CONFIG_MITIGATION_RETBLEED=y
CONFIG_MITIGATION_SPECTRE_V1=y
CONFIG_MITIGATION_SPECTRE_V2=y
CONFIG_MITIGATION_SRBDS=y
CONFIG_MITIGATION_SSB=y
CONFIG_MITIGATION_ITS=y
CONFIG_MITIGATION_TSA=y
CONFIG_RANDOMIZE_BASE=y
CONFIG_RANDOMIZE_MEMORY=y
CONFIG_RANDOMIZE_KSTACK_OFFSET=y
CONFIG_RANDOMIZE_KSTACK_OFFSET_DEFAULT=y
CONFIG_ARCH_MMAP_RND_BITS=32
CONFIG_ARCH_MMAP_RND_COMPAT_BITS=16
CONFIG_DEFAULT_MMAP_MIN_ADDR=65536
CONFIG_LEGACY_VSYSCALL_XONLY=n
CONFIG_LEGACY_VSYSCALL_NONE=y

# Stack, heap, and memory-permission protection.
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_VMAP_STACK=y
CONFIG_SCHED_STACK_END_CHECK=y
CONFIG_STRICT_KERNEL_RWX=y
CONFIG_STRICT_MODULE_RWX=y
CONFIG_DEBUG_KERNEL=y
CONFIG_DEBUG_WX=y
CONFIG_FORTIFY_SOURCE=y
CONFIG_HARDENED_USERCOPY=y
CONFIG_HARDENED_USERCOPY_DEFAULT_ON=y
CONFIG_SLAB_MERGE_DEFAULT=n
CONFIG_SLAB_FREELIST_RANDOM=y
CONFIG_SLAB_FREELIST_HARDENED=y
CONFIG_SLAB_BUCKETS=y
CONFIG_KMALLOC_PARTITION_CACHES=y
CONFIG_KMALLOC_PARTITION_TYPED=y
CONFIG_SHUFFLE_PAGE_ALLOCATOR=y
CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y
CONFIG_INIT_ON_FREE_DEFAULT_ON=y
CONFIG_INIT_STACK_NONE=n
CONFIG_INIT_STACK_ALL_ZERO=y
CONFIG_ZERO_CALL_USED_REGS=y
CONFIG_KSTACK_ERASE=y
CONFIG_KSTACK_ERASE_RUNTIME_DISABLE=n
CONFIG_PAGE_TABLE_CHECK=y
CONFIG_PAGE_TABLE_CHECK_ENFORCED=y
CONFIG_LIST_HARDENED=y
CONFIG_DEBUG_LIST=y
CONFIG_BUG_ON_DATA_CORRUPTION=y

# Restrict information leaks and interfaces commonly used by attackers.
CONFIG_SECURITY_DMESG_RESTRICT=y
CONFIG_PROC_KCORE=n
CONFIG_DEVMEM=n
CONFIG_LEGACY_TIOCSTI=n
CONFIG_LDISC_AUTOLOAD=n
CONFIG_COMPAT_BRK=n
CONFIG_KEXEC=n
CONFIG_KEXEC_FILE=n
CONFIG_HIBERNATION=n
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_UNPRIV_DEFAULT_OFF=y

# Build in the storage support used by Civilight's bootable images.
CONFIG_BLK_DEV_NVME=y
CONFIG_BTRFS_FS=y
CONFIG_VMD=y
CONFIG_USB_UAS=y

# Keep the firmware framebuffer available for the local UEFI text console.
CONFIG_DRM_EFIDRM=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y

# Exported modules use Kbuild's generated key; reject unsigned modules.
CONFIG_MODULES=y
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_ALL=y
CONFIG_MODULE_SIG_FORCE=y
CONFIG_MODULE_SIG_SHA512=y

# Userspace sandboxing, access controls, and kernel lockdown.
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
CONFIG_SECURITY=y
CONFIG_SECURITY_NETWORK=y
CONFIG_SECURITY_YAMA=y
CONFIG_SECURITY_LANDLOCK=y
CONFIG_SECURITY_SAFESETID=y
CONFIG_AUDIT=y
CONFIG_AUDITSYSCALL=y
CONFIG_SECURITYFS=y
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
CONFIG_LOCK_DOWN_KERNEL_FORCE_NONE=n
CONFIG_LOCK_DOWN_KERNEL_FORCE_INTEGRITY=n
CONFIG_LOCK_DOWN_KERNEL_FORCE_CONFIDENTIALITY=y
CONFIG_INTEGRITY=y
# The flavor profile selects exactly one exclusive major LSM.
CONFIG_CGROUP_DEBUG=n

# Embed the resolved config for auditing. Keep artifacts reasonably small.
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
CONFIG_DEBUG_INFO_NONE=y
