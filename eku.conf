CONFIG_SATA_VIA=m
CONFIG_VIRTIO_BALLOON=m
CONFIG_FUSE_FS=m
CONFIG_VIRTIO_FS=m
CONFIG_VMWARE_VMCI=m
CONFIG_HYPERVISOR_GUEST=y
CONFIG_HYPERV=y
CONFIG_HYPERV_VMBUS=m
CONFIG_HYPERV_STORAGE=m
CONFIG_HYPERV_KEYBOARD=m
CONFIG_HYPERV_BALLOON=m
CONFIG_CONNECTOR=y
CONFIG_HYPERV_UTILS=m

# Resource controls and filesystem/network support used by containers.
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y
CONFIG_CGROUPS=y
CONFIG_MEMCG=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_BPF=y
CONFIG_OVERLAY_FS=m
CONFIG_TUN=m
CONFIG_VETH=m
CONFIG_BRIDGE=m

# Native nftables over Netlink, with stateful IPv4/IPv6 filtering and NAT.
CONFIG_NETFILTER=y
CONFIG_NETFILTER_NETLINK=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_NAT=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_CT=y
CONFIG_NFT_LIMIT=y
CONFIG_NFT_LOG=y
CONFIG_NFT_REJECT=y
CONFIG_NFT_NAT=y
CONFIG_NFT_MASQ=y
CONFIG_NFT_REDIR=y

# Exported modules use Kbuild's generated key; reject unsigned modules.
CONFIG_MODULES=y
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_ALL=y
CONFIG_MODULE_SIG_FORCE=y
CONFIG_MODULE_SIG_SHA512=y

# Userspace sandboxing, access controls, and kernel lockdown.
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
CONFIG_SECURITY=y
CONFIG_RUST=y
CONFIG_SECURITY_MICROVISOR=y
CONFIG_MICROVISOR_PTRACE=y
CONFIG_MICROVISOR_FD=y
CONFIG_SECURITY_NETWORK=y
CONFIG_SECURITY_YAMA=y
CONFIG_SECURITY_LANDLOCK=y
CONFIG_SECURITY_SAFESETID=y
CONFIG_AUDIT=y
CONFIG_AUDITSYSCALL=y
CONFIG_SECURITYFS=y
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
CONFIG_LOCK_DOWN_KERNEL_FORCE_NONE=n
CONFIG_LOCK_DOWN_KERNEL_FORCE_INTEGRITY=n
CONFIG_LOCK_DOWN_KERNEL_FORCE_CONFIDENTIALITY=y
CONFIG_INTEGRITY=y
CONFIG_CGROUP_DEBUG=n

# Embed the resolved config for auditing. Keep artifacts reasonably small.
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
CONFIG_DEBUG_INFO_NONE=y
