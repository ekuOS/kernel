# AppArmor is the active major LSM; this kernel does not activate SELinux.
CONFIG_LOCALVERSION="-eku-aa"
CONFIG_SECURITY_SELINUX=n
CONFIG_SECURITY_APPARMOR=y
CONFIG_SECURITY_APPARMOR_DEBUG=n
CONFIG_SECURITY_APPARMOR_INTROSPECT_POLICY=y
CONFIG_SECURITY_APPARMOR_HASH=y
CONFIG_SECURITY_APPARMOR_HASH_DEFAULT=y
CONFIG_SECURITY_APPARMOR_EXPORT_BINARY=y
CONFIG_SECURITY_APPARMOR_COMPRESSED_POLICY=y
CONFIG_SECURITY_APPARMOR_PARANOID_LOAD=y
CONFIG_LSM="landlock,lockdown,yama,safesetid,integrity,apparmor"

# Additional kernel prerequisites for snap mounts.
# Userspace AppArmor policies and snapd are still required.
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_XATTR=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_LZO=y
CONFIG_SQUASHFS_LZ4=y
CONFIG_SQUASHFS_ZSTD=y
