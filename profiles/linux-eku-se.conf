# SELinux is the active major LSM. Requires a labeled filesystem and policy.
CONFIG_LOCALVERSION="-eku-se"
CONFIG_SECURITY_SELINUX=y
CONFIG_SECURITY_SELINUX_BOOTPARAM=n
CONFIG_SECURITY_SELINUX_DEVELOP=n
CONFIG_SECURITY_SELINUX_DEBUG=n
CONFIG_SECURITY_APPARMOR=n
CONFIG_LSM="landlock,lockdown,yama,safesetid,integrity,selinux"
