name: Publish kernel package repositories

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Sign and publish to GitHub Pages (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gentoo-kernel-binhost
  cancel-in-progress: false

jobs:
  build-binpkg:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
    runs-on: ubuntu-24.04
    # LLVM dependency builds occasionally push this job past 90 minutes.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: llvm
            stage3: amd64-llvm-systemd-20261116
          - flavor: multilib
            stage3: amd64-systemd-20261116
    env:
      BINHOST_PATH: amd64/23.0/${{ matrix.flavor }}/systemd
      EXPORT_NATIVE_PAYLOAD: ${{ matrix.flavor == 'multilib' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
          problem-matcher: false

      - name: Verify Dart scripts
        run: |
          dart format --output=none --set-exit-if-changed build.dart test/ packaging/gentoo/
          dart analyze build.dart test/ packaging/gentoo/
          dart run test/build_test.dart
          dart run test/clean_test.dart
          dart run test/profile_compatibility_test.dart
          dart compile exe packaging/gentoo/binhost.dart -o "$RUNNER_TEMP/ekuos-binhost"

      - name: Prepare Gentoo container
        run: docker build --pull --build-arg GENTOO_STAGE3=${{ matrix.stage3 }} -f packaging/gentoo/Containerfile -t ekuos-kernel-binhost packaging/gentoo

      - name: Build and test both Gentoo binpkgs
        run: dart run packaging/gentoo/ci.dart build

      - name: Save verified kernel payloads for native packaging
        if: matrix.flavor == 'multilib'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-native-input
          path: ${{ runner.temp }}/native-input/
          if-no-files-found: error
          compression-level: 0

      - name: Sign GPKGs and regenerate their Portage index
        if: github.event_name == 'push' || inputs.publish
        env:
          BINHOST_GPG_PRIVATE_KEY: ${{ secrets.BINHOST_GPG_PRIVATE_KEY }}
          BINHOST_GPG_PASSPHRASE: ${{ secrets.BINHOST_GPG_PASSPHRASE }}
        run: dart run packaging/gentoo/ci.dart sign

      - name: Verify publication checksums
        if: github.event_name == 'push' || inputs.publish
        working-directory: ${{ runner.temp }}/binhost/${{ env.BINHOST_PATH }}
        run: sha256sum --check SHA256SUMS

      - name: Save signed binrepo
        if: github.event_name == 'push' || inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: kernel-binhost-${{ matrix.flavor }}
          path: ${{ runner.temp }}/binhost/
          if-no-files-found: error
          compression-level: 0

  native-packages:
    needs: build-binpkg
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
          problem-matcher: false
      - uses: actions/download-artifact@v8
        with:
          name: kernel-native-input
          path: ${{ runner.temp }}/native-input
      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils rpm createrepo-c libarchive-tools makepkg pacman-package-manager zstd
      - name: Build native packages
        run: |
          dart format --output=none --set-exit-if-changed packaging/native/
          dart analyze packaging/native/
          dart run packaging/native/repositories.dart build "$RUNNER_TEMP/native-input" "$RUNNER_TEMP/native-site"
      - name: Sign and index native packages
        if: github.event_name == 'push' || inputs.publish
        env:
          BINHOST_GPG_PRIVATE_KEY: ${{ secrets.BINHOST_GPG_PRIVATE_KEY }}
          BINHOST_GPG_PASSPHRASE: ${{ secrets.BINHOST_GPG_PASSPHRASE }}
        run: dart run packaging/native/repositories.dart publish "$RUNNER_TEMP/native-site"
      - name: Save native repositories
        if: github.event_name == 'push' || inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: kernel-native-repositories
          path: ${{ runner.temp }}/native-site/
          if-no-files-found: error
          compression-level: 0

  assemble-pages:
    needs: [build-binpkg, native-packages]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: kernel-binhost-*
          path: ${{ runner.temp }}/binhost
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: kernel-native-repositories
          path: ${{ runner.temp }}/binhost

      - name: Write binhost usage page
        working-directory: ${{ runner.temp }}/binhost
        run: |
          echo '<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>ekuOS kernel package repositories</title>
            <style>
              body { font: 1rem/1.55 system-ui, sans-serif; max-width: 50rem; margin: 2rem auto; padding: 0 1rem; }
              pre { overflow-x: auto; padding: 1rem; border: 1px solid; border-radius: .4rem; }
            </style>
          </head>
          <body>
          <main>
            <h1>ekuOS kernel package repositories</h1>
            <p><a href="apt/Packages">APT index</a> ·
            <a href="dnf/repodata/repomd.xml">DNF index</a> ·
            <a href="pacman/x86_64/ekuos.db">pacman index</a> ·
            <a href="signing-key.asc">Signing key</a> ·
            <a href="https://github.com/ekuOS/kernel/blob/main/packaging/native/README.md">APT, DNF and pacman setup</a></p>
            <p>Debian/Ubuntu: <code>linux-image-eku</code> (AppArmor).
            Fedora: <code>kernel-eku</code> (SELinux).
            Arch Linux: <code>linux-eku-se</code> or <code>linux-eku-aa</code>.</p>
            <h2>Gentoo binhost</h2>
            <p>Signed SELinux (<code>linux-eku-se</code>) and AppArmor (<code>linux-eku-aa</code>)
            kernels for Gentoo amd64 LLVM/systemd and standard multilib/systemd.</p>
            <p>LLVM/systemd: <a href="amd64/23.0/llvm/systemd/Packages">Package index</a> ·
            <a href="amd64/23.0/llvm/systemd/signing-key.asc">Signing key</a> ·
            <a href="amd64/23.0/llvm/systemd/overlay.tar.gz">Source overlay</a> ·
            <a href="amd64/23.0/llvm/systemd/SHA256SUMS">Checksums</a> ·
            <a href="amd64/23.0/llvm/systemd/SHA256SUMS.asc">Checksum signature</a></p>
            <p>Standard multilib/systemd: <a href="amd64/23.0/multilib/systemd/Packages">Package index</a> ·
            <a href="amd64/23.0/multilib/systemd/signing-key.asc">Signing key</a> ·
            <a href="amd64/23.0/multilib/systemd/overlay.tar.gz">Source overlay</a> ·
            <a href="amd64/23.0/multilib/systemd/SHA256SUMS">Checksums</a> ·
            <a href="amd64/23.0/multilib/systemd/SHA256SUMS.asc">Checksum signature</a></p>

            <h2>1. Verify the signing key and overlay</h2>
            <p>Download the signing key, overlay, checksums and checksum signature from the links above.
            Compare the output of <code>gpg --show-keys --fingerprint signing-key.asc</code>
            with the full fingerprint obtained from the maintainer through a trusted separate channel.
            Only if they match, set <code>fingerprint</code> to that value and run:</p>
            <pre><code>sudo getuto
          sudo gpg --homedir /etc/portage/gnupg --import signing-key.asc
          printf "%s:6:\n" "$fingerprint" |
            sudo gpg --homedir /etc/portage/gnupg --import-ownertrust
          sudo gpg --homedir /etc/portage/gnupg --batch --check-trustdb
          sudo gpg --homedir /etc/portage/gnupg --assert-signer "$fingerprint" \
            --verify SHA256SUMS.asc SHA256SUMS &amp;&amp;
            grep "  overlay[.]tar[.]gz$" SHA256SUMS | sha256sum --check -</code></pre>
            <p>After verification succeeds, extract <code>overlay.tar.gz</code> into
            <code>/var/db/repos/ekuos-kernel</code>. Replace the overlay with the verified archive when updating.</p>

            <h2>2. Configure Portage</h2>
            <p>Add <code>/etc/portage/repos.conf/ekuos-kernel.conf</code>:</p>
            <pre><code>[ekuos-kernel]
          location = /var/db/repos/ekuos-kernel
          auto-sync = no</code></pre>
            <p>Add the following to <code>/etc/portage/binrepos.conf</code>, or to a file inside it if it is a directory:</p>
            <pre><code>[ekuos-kernel]
          priority = 9999
           sync-uri = https://ekuos.github.io/kernel/amd64/23.0/llvm/systemd/
          verify-signature = true</code></pre>
            <p>For the standard <code>23.0/systemd</code> multilib profile, use
            <code>amd64/23.0/multilib/systemd/</code> in the URL instead.</p>
            <p>Add the desired flavor to <code>/etc/portage/package.accept_keywords</code>:</p>
            <pre><code>sys-kernel/linux-eku-se::ekuos-kernel ~amd64
          sys-kernel/linux-eku-aa::ekuos-kernel ~amd64</code></pre>

            <h2>3. Preview and install</h2>
            <p>Mount <code>/boot</code> first if it is a separate filesystem. Check that
            the preview selects the <code>ekuos-kernel</code> binary:</p>
            <pre><code>sudo emerge --pretend --verbose --getbinpkg --usepkgonly --binpkg-respect-use=y \
            sys-kernel/linux-eku-se::ekuos-kernel</code></pre>
            <p>Replace <code>--pretend --verbose</code> with <code>--ask</code> to install.
            Use <code>linux-eku-aa</code> for AppArmor. Set up the initramfs, bootloader,
            Secure Boot signing and userspace security policy separately as needed.
            Keep a known-good boot entry.</p>
            <p><a href="https://github.com/ekuOS/kernel">Source repository</a></p>
          </main>
          </body>
          </html>' > index.html

      - name: Upload signed binhost to Pages
        if: github.event_name == 'push' || inputs.publish
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/binhost

  deploy:
    needs: assemble-pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy binhost to Pages
        id: deployment
        uses: actions/deploy-pages@v5
